<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>封面 — 学术风演示模板</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../deck.css">
<link rel="stylesheet" href="../components.css">
<style>
/* ==========================================================================
   封面（临摹 source/2025redyellownew.pptx 第 1 页）
   图层从下到上照抄 slide1.xml 的 spTree 顺序：
     图片 4（底图）→ 矩形 5（奶黄蒙版）→ Picture 2（校名区）→ 文本框 9（校训）
     → 文本框 12（副标题）→ 组合 20［细线 + 汇报人 + 细线］
   组件定义见 ../components.css，本文件只负责「摆位置」。
   ========================================================================== */
.cover { background: var(--c-white); }

/* Picture 2 | off(4661743, 828438) ext(2873376, 770356) = (489.2, 86.9) 301.5×80.8 */
.cover__logo { left: 489.2px; top: 86.9px; }

/* 文本框 9 | off(1103107, 1971953) ext(10189197, 708324) = (115.7, 206.9) 1068.9×74.3 */
.cover__motto {
  position: absolute;
  left: 115.7px; top: 206.9px; width: 1068.9px; height: 74.3px;
  line-height: 74.3px;
}

/* 文本框 12 | off(3283899, 3042113) ext(5208214, 369332) = (344.7, 319.3) 546.7×38.8
   sz=1800 b=1 algn=dist color=#C92B2F
   bodyPr 未写 lIns → 默认 91440 EMU = 9.6px：分散对齐发生在这 9.6px 之内，
   实测 PPT 文字宽 527 = 546.7 − 9.6×2，故必须补 padding 否则会撑成 546.7 */
.cover__subtitle {
  position: absolute;
  left: 344.7px; top: 319.3px; width: 546.7px; height: 38.8px;
  padding: 0 9.6px;
  font-family: var(--f-title);
  font-size: var(--fs-18);
  font-weight: 700;
  line-height: 38.8px;
  color: var(--c-red-true);
  text-align: justify;
  text-align-last: justify;
}

/* 组合 20：左线 off(2393909,3760914) / 右线 off(7817962,3761866) ext(1980160, …)
   ⚠ 组合的 chOff≠off（chOff x=2044700 vs off x=2393909），子形状坐标需换算：
     绝对 x = off + (child − chOff) → 左线 251.3、右线 820.8（不是 dump 里的 214.7/784.1） */
.cover__rule--l { left: 251.3px; top: 413.8px; }
.cover__rule--r { left: 820.8px; top: 414.2px; }

/* 文本框 16 | 组合内 off(4538989,3760914) ext(3112988, 369332) = (476.7,394.8) 326.7×38.8 */
.cover__presenter {
  position: absolute;
  left: 476.7px; top: 394.8px; width: 326.7px; height: 38.8px;
  padding: 0 9.6px;
  font-family: var(--f-title);
  font-size: var(--fs-18);
  font-weight: 700;
  line-height: 38.8px;
  color: var(--c-red-deep);
  text-align: justify;
  text-align-last: justify;
}
</style>
</head>
<body>

<div class="stage">
  <section class="slide is-solo cover">

    <img class="cover-bg" src="../assets/bg-cover.jpeg" alt="">
    <div class="cover-veil"></div>

    <img class="brandmark cover__logo" src="../assets/logo-xjtu.png" alt="西安交通大学">

    <div class="motto cover__motto">精勤求学  敦笃励志  果毅力行  忠恕任事</div>

    <div class="cover__subtitle">西安交通大学学术风格汇报答辩PPT模版</div>

    <!-- 组合 20：左线 + 汇报人 + 右线 -->
    <span class="hairline cover__rule--l"></span>
    <div class="cover__presenter">汇报人：网络信息中心</div>
    <span class="hairline cover__rule--r"></span>

  </section>
</div>

<script src="../deck.js"></script>
</body>
</html>
