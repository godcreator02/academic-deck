<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>封底 — 学术风演示模板</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../deck.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="../pages.css">
</head>
<body>

<div class="stage">
  <section class="slide is-solo thanks">

    <!-- 图层照抄 slide9.xml：底图 → 奶黄蒙版 → 空心弧 → 组合1（THANKS + 副行）→ 校名区 -->
    <img class="thanks-bg" src="../assets/bg-cover.jpeg" alt="">
    <div class="cover-veil"></div>

    <svg class="thanks__arc" viewBox="0 0 155.6667 155.6667" aria-hidden="true">
      <!-- 外圈细描边 ln=#595959 w=0.25pt（画宽 = 环厚 1.639 + 0.25） -->
      <circle cx="77.8334" cy="77.8334" r="77.0139" fill="none"
              stroke="#595959" stroke-width="1.889" stroke-dasharray="203.11 78.90"/>
      <!-- 环本体 fill=#E49E3F，环厚 = adj3 1053/100000 × 155.6667 = 1.639pt -->
      <circle cx="77.8334" cy="77.8334" r="77.0139" fill="none"
              stroke="#E49E3F" stroke-width="1.639" stroke-dasharray="203.11 78.90"/>
    </svg>

    <div class="wordmark thanks__word">THANKS</div>
    <div class="wordmark-sub thanks__sub">谢谢各位专家</div>

    <img class="brandmark thanks__logo" src="../assets/logo-xjtu.png" alt="西安交通大学">

  </section>
</div>

<script src="../deck.js"></script>
</body>
</html>
