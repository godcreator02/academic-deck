<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>目录 — 学术风演示模板</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../deck.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="../pages.css">
</head>
<body>

<div class="stage">
  <section class="slide is-solo toc">

    <!-- slideLayout3：左栏底图（带 srcRect 裁切）+ 蒙版 + 「目录」徽标 -->
    <div class="toc__strip"><img src="../assets/bg-toc.png" alt=""></div>
    <div class="toc__veil"></div>

    <div class="toc-badge toc__badge">目录</div>
    <svg class="toc-ring toc__ring" viewBox="0 0 186.603 181.2571" aria-hidden="true">
      <defs>
        <!-- 0% 在右下(SE)、100% 在左上(NW)：对应 OOXML lin ang=225°（规则给 315.8°） -->
        <linearGradient id="ringGrad" x1="100%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#FFC000"/>
          <stop offset="100%" stop-color="#C00000"/>
        </linearGradient>
      </defs>
      <!-- algn=ctr → 路径半径 = 边长/2；viewBox 与元素框 1:1，外溢靠 overflow:visible -->
      <ellipse cx="93.3015" cy="90.62855" rx="93.3015" ry="90.62855"
               fill="none" stroke="url(#ringGrad)" stroke-width="4.5"/>
    </svg>

    <!-- slide2：四个序号 + 四条胶囊（占位文字换成中性组会向章节名） -->
    <div class="toc-num toc__num--1">1</div>
    <div class="toc-num toc__num--2">2</div>
    <div class="toc-num toc__num--3">3</div>
    <div class="toc-num toc__num--4">4</div>

    <div class="toc-item toc__item--1">研究背景与意义</div>
    <div class="toc-item toc__item--2">国内外研究现状</div>
    <div class="toc-item toc__item--3">方法与技术路线</div>
    <div class="toc-item toc__item--4">实验设计与结论</div>

    <img class="brandmark toc__logo" src="../assets/logo-xjtu.png" alt="西安交通大学">

  </section>
</div>

<script src="../deck.js"></script>
</body>
</html>
